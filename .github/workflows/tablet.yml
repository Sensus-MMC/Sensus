name: Update tablet page pack

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  repository_dispatch:
    types: [sensus-publish]

permissions:
  contents: write

concurrency:
  group: tablet-page-pack
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Install capture fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y ttf-mscorefonts-installer || true
      - run: node scripts/tablet.mjs --allow-font-fallback
      - name: Commit page pack
        run: |
          cp tablet/feed.json feed.json
          git config user.name "Sensus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tablet feed.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Tablet"
          git push
